name: CI

# 门禁：所有 push 到 main 的提交与所有 Pull Request 都必须通过单元测试与静态检查。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支/PR 的重复触发只保留最新一次运行，避免排队浪费额度。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 流水线只读仓库内容，不需要任何写权限。
permissions:
  contents: read

jobs:
  test:
    name: 单元测试 (go test -race)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # Go 版本单一来源于 go.mod，避免 CI 与本地/镜像工具链漂移。
      - name: 安装 Go (版本取自 go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 校验格式 (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未通过 gofmt，请在本地执行 gofmt -w ."
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: 静态检查 (go vet)
        run: go vet ./...

      - name: 编译检查
        run: go build -trimpath ./...

      - name: 单元测试 (并发竞态检测 + 覆盖率)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: 汇总覆盖率
        run: go tool cover -func=coverage.out | tail -n 1

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  lint:
    name: 静态代码扫描 (golangci-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Go (版本取自 go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 配置为 .golangci.yml 的 v2 格式；仓库红线要求 0 issues。
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=5m
